<style>

      --indent: #000000; }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font: 13px/1.5 ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  header { position:sticky; top:0; z-index:10; background:var(--panel);

    flex-wrap:wrap; gap:10px; align-items:center; }
  header h1 { font-size:14px; margin:0 8px 0 0; font-weight:600; }
  header .doc { color:var(--muted); font-size:12px; }
  button, label.btn { background:transparent; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:4px 9px; cursor:pointer; font:inherit; font-size:12px; }
  button:hover, label.btn:hover { border-color:var(--accent); color:var(--accent); }
  #search { background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:4px 9px; font:inherit; font-size:12px; min-width:220px; }
  #stats { color:var(--muted); font-size:12px; margin-left:auto; }
  #tree { padding:14px 18px 60px; }
  #drop { margin:40px auto; max-width:620px; border:2px dashed var(--line);
    border-radius:10px; padding:48px 24px; text-align:center; color:var(--muted); }
  #drop.hover { border-color:var(--accent); color:var(--accent); }
  #drop h2 { color:var(--fg); font-weight:600; }
  details { margin:0; }
  .children { border-left:2px solid var(--indent); margin-left:7px; padding-left:14px; }
  details > summary { list-style:none; cursor:pointer; padding:1px 0;
    white-space:nowrap; }
  details > summary::-webkit-details-marker { display:none; }
  summary .tw { display:inline-block; width:14px; color:var(--muted); }
  details[open] > summary .tw::before { content:"▾"; }
  details:not([open]) > summary .tw::before { content:"▸"; }
  .leaf .tw::before { content:"•"; color:var(--line); }
  .leaf { padding:1px 0 1px 6px; white-space:nowrap; }
  .rel { color:var(--rel); }
  .pkg { color:var(--pkg); }
  .ver { color:var(--muted); }
  .count { color:var(--muted); font-size:11px; margin-left:6px; }
  .dup { color:var(--muted); font-style:italic; margin-left:6px; }
  .hit > summary .pkg, .leaf.hit .pkg { color:var(--hit); font-weight:600; }
  .meta { color:var(--muted); margin-left:20px; white-space:normal;
    max-width:900px; padding:2px 0; }
  .meta b { color:var(--fg); font-weight:600; }
  .hidden { display:none; }
  a { color:var(--accent); text-decoration:none; }
</style>

<script>
"use strict";
const $ = s => document.querySelector(s);
const treeEl = $("#tree"), dropEl = $("#drop"), statsEl = $("#stats"), docEl = $("#docname");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(doc){
  // Index packages by SPDXID
  const byId = new Map();
  (doc.packages||[]).forEach(p => byId.set(p.SPDXID, p));
  (doc.files||[]).forEach(f => byId.set(f.SPDXID, f)); // files can be relationship targets too

  // Build adjacency: parent SPDXID -> [{type, id}]
  const kids = new Map();
  const roots = [];
  const hasParent = new Set();
  for (const r of (doc.relationships||[])) {
    const from = r.spdxElementId, to = r.relatedSpdxElement, t = r.relationshipType;
    if (t === "DESCRIBES" || from === "SPDXRef-DOCUMENT") { roots.push(to); continue; }
    if (!kids.has(from)) kids.set(from, []);
    kids.get(from).push({type:t, id:to});
    hasParent.add(to);
  }
  // Fallback: any package that is a CONTAINS/GENERATED_FROM source but never a target = a root too
  if (roots.length === 0) {
    for (const id of kids.keys()) if (!hasParent.has(id)) roots.push(id);
  }

  const nameOf = id => { const p = byId.get(id); return p ? (p.name||id) : id; };
  const verOf  = id => { const p = byId.get(id); return p && p.versionInfo ? p.versionInfo : ""; };

  function metaHtml(p){
    if(!p) return "";
    const rows = [];
    const add=(k,v)=>{ if(v && v!=="NOASSERTION") rows.push(`<b>${esc(k)}:</b> ${esc(v)}`); };
    add("SPDXID", p.SPDXID);
    add("version", p.versionInfo);
    add("license (declared)", p.licenseDeclared);
    add("license (concluded)", p.licenseConcluded);
    add("supplier", p.supplier);
    add("download", p.downloadLocation);
    add("copyright", p.copyrightText);
    add("description", p.description);
    if (p.externalRefs) for (const e of p.externalRefs)
      rows.push(`<b>ref:</b> ${esc(e.referenceType)} ${esc(e.referenceLocator)}`);
    if (p.checksums) for (const c of p.checksums)
      rows.push(`<b>${esc(c.algorithm)}:</b> ${esc(c.checksumValue)}`);
    return rows.length ? `<div class="meta hidden">${rows.join("<br>")}</div>` : "";
  }

  let nodeCount = 0;
  function node(id, relType, path){
    nodeCount++;
    const p = byId.get(id);
    const nm = esc(nameOf(id)), ver = verOf(id);
    const verS = ver ? ` <span class="ver">@${esc(ver)}</span>` : "";
    const relS = relType ? `<span class="rel">${esc(relType)}</span> ` : "";
    const children = kids.get(id) || [];
    const cyc = path.has(id);          // guard against cycles along this branch
    const label = `${relS}<span class="pkg">${nm}</span>${verS}`;

    if (children.length === 0 || cyc){
      const dup = cyc ? ` <span class="dup">↺ (already shown above)</span>` : "";
      const meta = metaHtml(p);
      const toggle = meta ? ` data-meta="1"` : "";
      const wrapped = meta ? `<div class="children">${meta}</div>` : "";
      return `<div class="leaf" data-name="${nm.toLowerCase()}"${toggle}><span class="tw"></span>${label}${dup}</div>${wrapped}`;
    }
    const np = new Set(path); np.add(id);
    let inner = "";
    for (const c of children) inner += node(c.id, c.type, np);
    return `<details data-name="${nm.toLowerCase()}"><summary><span class="tw"></span>${label}`
         + `<span class="count">${children.length} rel</span></summary>`
         + `<div class="children">` + metaHtml(p) + inner + `</div></details>`;
  }

  let html = "";
  for (const r of roots) html += node(r, null, new Set());
  treeEl.innerHTML = html;

  docEl.textContent = doc.name || "(unnamed document)";
  statsEl.textContent = `${(doc.packages||[]).length} packages · ${(doc.relationships||[]).length} relationships · ${nodeCount} tree nodes`;
  dropEl.classList.add("hidden");
}

// ---- meta toggle (click a leaf/summary shows package details) ----
treeEl.addEventListener("click", e => {
  if (e.target.closest("summary")) { /* let details toggle; also flip its meta */ }
  const leaf = e.target.closest(".leaf");
  if (leaf && leaf.dataset.meta){
    const w = leaf.nextElementSibling;
    const m = w && w.querySelector(":scope > .meta");
    if (m) m.classList.toggle("hidden");
  }
});
// For details: reveal meta on open
treeEl.addEventListener("toggle", e => {
  const d = e.target;
  if (d.tagName !== "DETAILS") return;
  const first = d.querySelector(":scope > .children > .meta");
  if (first) first.classList.toggle("hidden", !d.open);
}, true);

// ---- expand / collapse ----
$("#expand").onclick   = () => treeEl.querySelectorAll("details").forEach(d=>d.open=true);
$("#collapse").onclick = () => treeEl.querySelectorAll("details").forEach(d=>d.open=false);

// ---- search / filter ----
$("#search").addEventListener("input", e => {
  const q = e.target.value.trim();
  const all = treeEl.querySelectorAll("details, .leaf");
  if (!q){ all.forEach(n=>{ n.classList.remove("hidden","hit"); }); return; }
  let re; try { re = new RegExp(q, "i"); } catch { re = null; }
  const match = name => re ? re.test(name) : name.includes(q.toLowerCase());
  // reset
  all.forEach(n => n.classList.remove("hidden","hit"));
  // mark matches, then reveal their ancestor chain
  all.forEach(n => {
    if (match(n.dataset.name||"")){
      n.classList.add("hit");
      let a = n;
      while (a && a !== treeEl){ a.classList.remove("hidden"); if(a.tagName==="DETAILS") a.open=true; a = a.parentElement.closest("details, #tree"); if(a && a.id) break; }
    } else {
      n.classList.add("hidden");
    }
  });
  // un-hide ancestors that contain a hit (walk up from each hit)
  treeEl.querySelectorAll(".hit").forEach(h=>{
    let a = h.parentElement;
    while (a && a !== treeEl){ if(a.tagName==="DETAILS"){ a.classList.remove("hidden"); a.open=true; } a = a.parentElement; }
  });
});

// ---- file loading ----
function load(file){
  const rd = new FileReader();
  rd.onload = () => {
    try { render(JSON.parse(rd.result)); }
    catch(err){ alert("Could not parse SPDX JSON:\n"+err.message); }
  };
  rd.readAsText(file);
}
$("#file").addEventListener("change", e => { if(e.target.files[0]) load(e.target.files[0]); });
["dragenter","dragover"].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add("hover");}));
["dragleave","drop"].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.remove("hover");}));
dropEl.addEventListener("drop", e => { const f=e.dataTransfer.files[0]; if(f) load(f); });
document.addEventListener("dragover", e=>e.preventDefault());
document.addEventListener("drop", e=>{ e.preventDefault(); if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });

// Inlined data (shipped build): if the #spdx-data block holds a document, render it now.
const inlineTxt = (document.getElementById("spdx-data")?.textContent || "").trim();
if (inlineTxt){
  try { render(JSON.parse(inlineTxt)); }
  catch(err){ alert("Inlined SPDX data is invalid:\n"+err.message); }
} else {
  // ?src=path.json auto-load when served over http(s)
  const p = new URLSearchParams(location.search).get("src");
  if (p && location.protocol.startsWith("http")){
    fetch(p).then(r=>r.json()).then(render).catch(()=>{});
  }
}
</script>
</body>
</html>
